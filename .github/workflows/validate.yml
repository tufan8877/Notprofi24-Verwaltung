name: Validate Notprofi24
on:
  pull_request:
  push:
    branches:
      - feature/notdienst-objekte-anrufe
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
